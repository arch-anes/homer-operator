name: Build Helm Chart

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-release:
    name: Build Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Package Helm chart
        run: helm lint ./charts/homer-operator

      - name: Render Helm chart
        run: helm template homer-operator ./charts/homer-operator
